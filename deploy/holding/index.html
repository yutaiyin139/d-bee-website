<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>北京迪蜂科技有限公司 · 官网建设中</title>
<meta name="description" content="北京迪蜂科技有限公司官方网站，正在建设中。">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #faf9f6;
    color: #1f2328;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  main { flex: 1; display: grid; place-items: center; padding: 56px 24px; }
  .card { width: 100%; max-width: 560px; text-align: center; }
  .mark {
    display: inline-grid; place-items: center;
    width: 64px; height: 64px; margin-bottom: 28px;
    border-radius: 18px; background: #fff3cf;
    font-size: 32px; line-height: 1;
  }
  h1 { margin: 0 0 12px; font-size: clamp(24px, 5vw, 34px); font-weight: 650; letter-spacing: .01em; }
  .lead { margin: 0 auto 32px; max-width: 400px; color: #57606a; font-size: 16px; }
  .btn {
    display: inline-block; padding: 11px 24px;
    border-radius: 999px; background: #1f2328; color: #fff;
    font-size: 15px; font-weight: 500; text-decoration: none;
    transition: opacity .15s ease;
  }
  .btn:hover, .btn:focus-visible { opacity: .82; }
  .btn:focus-visible { outline: 3px solid #f0b429; outline-offset: 3px; }
  footer {
    padding: 24px; text-align: center;
    border-top: 1px solid #eae6dc; color: #6e7781; font-size: 13px;
  }
  footer p { margin: 4px 0; }
  footer a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  footer a:hover { color: #1f2328; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark" aria-hidden="true">🐝</div>
    <h1>官网建设中</h1>
    <p class="lead">北京迪蜂科技有限公司官方网站正在筹备，敬请期待。</p>
    <a class="btn" href="https://d-bee.cn/">访问自律蜜蜂 Web 版 →</a>
  </div>
</main>
<footer>
  <p>北京迪蜂科技有限公司</p>
  <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">京ICP备2026075565号-1</a></p>
</footer>
</body>
</html>
