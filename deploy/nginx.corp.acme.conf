# 阶段 1 · 官网域名仅 80 端口：ACME HTTP-01 校验 + 建设中占位
# 安装路径：/etc/nginx/sites-available/d-bee-corp.acme
# 启用链接：/etc/nginx/sites-enabled/00-d-bee-corp -> 本文件
#
# 🔴 为什么必须用 00- 前缀（零影响的关键）：
#    线上 /etc/nginx/sites-available/d-bee 的主 server 块 server_name 里
#    已经含 d-bee.com.cn / www.d-bee.com.cn（2026-11-06 手工加的）。
#    nginx 按 include sites-enabled/* 的**字母序**加载，同名 server_name
#    后加载的会被 ignore。00- 让本块先注册 → 官网域名命中本块；
#    d-bee.cn / www.d-bee.cn 仍精确命中主块，行为逐字不变。
#    nginx -t 会出现 "conflicting server name ... ignored" 警告，属预期、不影响运行。
#
# 本阶段不暴露任何官网内容：除 ACME 校验路径外一律 503。

server {
    listen 80;
    listen [::]:80;
    server_name d-bee.com.cn www.d-bee.com.cn;

    root /var/www/d-bee-corp;
    default_type text/plain;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>建设中</title><h1>官网建设中</h1>';
    }
}
