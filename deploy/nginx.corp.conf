# 阶段 2 · 官网正式配置（80 + 443，同端口按 server_name 分流）
# 安装路径：/etc/nginx/sites-available/d-bee-corp
# 启用链接：/etc/nginx/sites-enabled/00-d-bee-corp -> 本文件（与阶段 1 同名，切换指向即可）
#
# 🔴 零影响设计（对 https://d-bee.cn/ 的 Web 端）
#   1. 不改 /etc/nginx/sites-available/d-bee 的任何一行；不重载网关、不碰数据库、不动证书目录 d-bee.cn/。
#   2. 不新增端口：80 / 443 复用 nginx 已有监听，靠 server_name 区分两个站点。
#   3. 独立 root /var/www/d-bee-corp，独立证书 /etc/letsencrypt/live/d-bee-corp/。
#   4. 官网纯静态，**不反代 127.0.0.1:8080 网关**（主项目 deploy-gateway.sh 的既定规划）。
#   5. 80 的 default_server 仍归主块；本块不声明 default_server。
#
# ⚠️ 已知副作用：443 上主块没有 default_server 标记，本块因 00- 前缀先加载会成为
#    443 默认 server —— 用 IP 或未知 Host 访问 https 会落到本块证书（原本落 d-bee.cn 证书，
#    两者对 IP 都不匹配，均会告警）。**不影响 d-bee.cn / www.d-bee.cn 域名的任何请求**。
#    若要彻底消除，需手术式从主块 server_name（第 25、120 行）删掉
#    d-bee.com.cn / www.d-bee.com.cn 两个名字 —— 属改动主配置，须单独批准，脚本默认不做。

server {
    listen 80;
    listen [::]:80;
    server_name d-bee.com.cn www.d-bee.com.cn;

    root /var/www/d-bee-corp;

    # 独立证书续期用 certonly --webroot，续期时也要能过 HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;   # 与 Web 端一致：308 保留方法与请求体
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name d-bee.com.cn www.d-bee.com.cn;

    # 🔴 独立证书，绝不复用 /etc/letsencrypt/live/d-bee.cn/（那张 SAN 只有 d-bee.cn / www.d-bee.cn）
    ssl_certificate /etc/letsencrypt/live/d-bee-corp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/d-bee-corp/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/d-bee-corp;
    index index.html;
    client_max_body_size 5m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 纯静态多页站：不做 SPA 兜底，找不到就 404（便于发现漏传文件）
    location / {
        try_files $uri $uri/ =404;
    }
}
